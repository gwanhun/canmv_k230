name: CanMV K230 Build for PreRelease

on:
  workflow_dispatch:
    inputs:
      configs:
        description: 'The config list which will compiled'
        required: false
        type: string
        default: >
          k230_canmv_01studio_defconfig
      extra_config:
        description: 'Extra Kconfig lines appended to each defconfig (space separated)'
        required: false
        type: string
        default: 'CONFIG_ENABLE_BLUETOOTH=y'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Setup git
        run: |
          git config --global user.name k230-ci
          git config --global user.email k230-ci@example.com
      - name: Install repo
        run: |
          # install repo
          mkdir -p ~/.bin/
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod +x ~/.bin/repo

      - name: Prepare code
        run: |
          rm -rf *
          ls -alh
          ~/.bin/repo init -u https://github.com/gwanhun/manifest.git -b master --repo-url=https://github.com/canmv-k230/git-repo.git
          ~/.bin/repo sync

      - name: Apply extra config
        run: |
          # 펌웨어 기본값에 없는 옵션을 보드 설정에 덧붙인다(예: 블루투스).
          for proj in $CONFIGS; do
            for opt in $EXTRA_CONFIG; do
              key="${opt%%=*}"
              sed -i "/^${key}=/d;/^# ${key} is not set/d" "configs/${proj}"
              echo "$opt" >> "configs/${proj}"
            done
            echo "== configs/${proj} tail"; tail -5 "configs/${proj}"
          done
        env:
          CONFIGS: ${{ inputs.configs }}
          EXTRA_CONFIG: ${{ inputs.extra_config }}

      - name: Prepare Environment
        run: |
          sudo apt update
          sudo apt install -y bison flex gcc libncurses5-dev pkg-config \
            libconfuse-dev libssl-dev python3 python3-pip python-is-python3 python3-venv \
            cmake libyaml-dev scons mtools bzip2
          python3 -m venv ~/.canmv_venv
          source ~/.canmv_venv/bin/activate
          pip3 install pycryptodome gmssl jsonschema jinja2

      - name: Download toolchains
        run: |
          make dl_toolchain

      - name: Build Projects
        run: |
          source ~/.canmv_venv/bin/activate
          projects=($CONFIGS)
          echo "Config list is ${projects}"
          for proj in ${projects[@]};do
            echo "-------------------"
            echo "build project ${proj}"
            echo "-------------------"
            make ${proj}
            time make -j8
            echo "-------------------"
          done
        env:
          IS_CI: 1
          CONFIGS: ${{ inputs.configs }}

      - name: Set Env
        run: |
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV

      - name: Set Relese Txt
        run: |
          cat > prerelease.txt << 'EOF'
          Pre Release自动编译，并会删除旧的编译产物，只保留当前最新镜像，仅供测试使用
          Pre Release build with latest ${{ github.ref_name }} branch, it will delete old build and only keeping the latest version.
          Current ${{ github.ref_name }} branch build at ${{ env.BUILDTIME }} , Current build git commit id ${{ github.sha }}
          EOF

      - name: Upload images to PreRelease Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: PreRelease
          files: |
            output/**/*.img.gz
            output/**/*.img.gz.md5
          prerelease: true
          generate_release_notes: true
          body_path: prerelease.txt
